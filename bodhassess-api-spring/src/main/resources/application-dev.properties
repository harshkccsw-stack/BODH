# ====== Dev profile — MySQL via SSH tunnel on localhost:3307 ======
# 3307 is the local end of `ssh -L 3307:localhost:3306 ...` forwarding to the
# remote MySQL. (A local Docker MySQL still listens on 3306 — don't use it.)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bodhassess?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:bodh}
spring.datasource.password=${DB_PASSWORD:bodh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
