server {
    listen 80;
    server_name api.bodh.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.bodh.biz;

    ssl_certificate /etc/letsencrypt/live/api.bodh.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bodh.biz/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://bodhassess-api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Respondent portal (standalone SPA) ----------------------------------
server {
    listen 80;
    server_name portal.bodh.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name portal.bodh.biz;

    # Issue with: certbot certonly --webroot -w /var/www/certbot -d portal.bodh.biz
    ssl_certificate /etc/letsencrypt/live/portal.bodh.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.bodh.biz/privkey.pem;

    location / {
        proxy_pass http://bodhassess-portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
