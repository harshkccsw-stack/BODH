server {
    listen 80;
    server_name api.bodh.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.bodh.biz;

    ssl_certificate /etc/letsencrypt/live/api.bodh.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bodh.biz/privkey.pem;

    client_max_body_size 50m;

    # Docker's embedded DNS. Without an explicit resolver nginx resolves the
    # upstream name ONCE at startup and caches the IP forever, so recreating
    # the api container (which gets a new bridge IP) makes every request 502
    # until nginx is reloaded. Resolving through a variable defers the lookup
    # to request time and honours the 10s TTL. (Hit on 2026-08-19.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream bodhpsychometric-api;

    # Actuator (health/info) exists for the droplet's deploy gate, polled over
    # loopback (127.0.0.1:8080). This vhost proxies everything else, so shut
    # the door here rather than rely on the app's own whitelist.
    location ^~ /actuator/ {
        return 404;
    }

    # AI routes call OpenAI and are the only endpoints that can legitimately
    # run for minutes: app.openai.timeout-seconds is 120, and the sheet mapper
    # spends a SECOND call when the model's first answer fails validation
    # (SheetMappingService "retrying once"), so ~240s is the real ceiling.
    # nginx's default proxy_read_timeout is 60s, which cut these off mid-flight
    # and answered 504 — and because nginx writes that 504 itself, it carries
    # no CORS headers, so the browser reported it as an Access-Control-Allow-
    # Origin failure instead of a timeout. (Hit on 2026-09-18.)
    #
    # Scoped to the AI paths on purpose: raising the timeout globally would
    # mask a genuine hang anywhere else for five minutes instead of one.
    # proxy_set_header does NOT inherit from a sibling location, so the four
    # forwarding headers are repeated here — drop them and the app loses the
    # client IP (and X-Forwarded-Proto, which HSTS and getRemoteAddr rely on).
    location ^~ /api/questions/ai/ {
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/report-rules/ai/ {
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

