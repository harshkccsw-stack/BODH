# MemoryMesh's vhost lives in ITS repo (memoryMesh/MemoryMesh/nginx/conf.d),
# mounted at /etc/nginx/memorymesh.d by docker-compose.yml. It is pulled in
# through a directory mount plus this include, rather than by bind-mounting
# the file itself, so that edits over there are picked up by a plain
# `nginx -s reload` — a single-file bind mount keeps pointing at the OLD inode
# once an editor or git replaces the file, and only a container recreate
# would notice. The glob matching nothing is fine: nginx still starts.
include /etc/nginx/memorymesh.d/*.conf;
