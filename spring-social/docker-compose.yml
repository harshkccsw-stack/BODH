services:
  mysql:
    image: mysql:8.0
    container_name: bodhpsychometric-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Google.com1}
      MYSQL_DATABASE: ${DB_NAME:-bodhpsychometric}
      MYSQL_USER: ${DB_USERNAME:-bodh}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bodh}
    ports:
      # host 3309 -> container 3306 (MySQL always listens on 3306 inside the
      # container; 3306/3307 on this machine belong to career-nine and the
      # legacy bodhassess DB)
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-Google.com1}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bodhpsychometric-redis
    restart: unless-stopped
    ports:
      # Default Redis port straight through — the app's spring.data.redis
      # defaults (localhost:6379) hit this with no env vars set.
      - "6379:6379"
    # Cache + staging store, not a system of record: staged submissions are
    # re-creatable only until digested, so appendonly keeps a restart from
    # dropping a submission that has not reached MySQL yet.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
