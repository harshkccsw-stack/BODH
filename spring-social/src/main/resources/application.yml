        auto_quote_keyword: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://admin.bodh.biz,https://*.bodh.biz,https://portal.bodh.biz}
  superadmin:
    email: superadmin@bodh.biz
    dob: 1990-01-01
  jwt:
    # HS256 needs >= 32 bytes; override in every real environment.
    secret: ${JWT_SECRET:eb36fabf9a4245f0e94e981537361065878f2b21d557f75b0137343b7de06f80}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
