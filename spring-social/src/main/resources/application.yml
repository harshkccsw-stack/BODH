    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "schema matching the entity model at v1"
    # Flyway substitutes ${...} in migration FILES by default, so a migration
    # that merely DOCUMENTS the report engine's ${tag} placeholder syntax fails
    # to parse with "No value provided for placeholder". Nothing here has ever
    # used a Flyway placeholder, so the feature is turned off rather than every
    # future report migration having to avoid writing the syntax it implements.
    placeholder-replacement: false

  jpa:
    hibernate:
      # Hibernate still builds/extends the schema from the entities — there
      # is no baseline migration, so a fresh database is created here. Switch
      # to validate once Flyway owns a full schema from V1.
      ddl-auto: validate
    # Every statement logged and pretty-printed is a real cost in production
    # and buries the application's own logs. Development keeps it on.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Quote identifiers that collide with the dialect's reserved words
        # (e.g. the User table on H2), so entity names stay portable.
        auto_quote_keyword: true

  # See the development profile — set explicitly so the two environments agree,
  # and under spring.web.error.* because server.error.* stopped binding in
  # Boot 4.0.
  web:
    error:
      include-message: always
      include-stacktrace: never
      include-exception: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.bodhpsychometric: INFO
  pattern:
    level: "%5p [%X{requestId:-} %X{actor:-}]"

app:
  redis:
    # See the development profile — OFF restores the pre-Redis behaviour.
    enabled: ${REDIS_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173,https://admin.bodh.biz,https://*.bodh.biz,https://portal.bodh.biz}
  security:
    # OFF: ActorFilter resolves the bearer when there is one and serves the
    # request either way — an anonymous call still works and is simply logged
    # without a who. ON: anything that resolved to anonymous is answered 401
    # before it reaches a controller (the sign-in and self-registration
    # endpoints stay open — see ActorFilter.PUBLIC_PATTERNS).
    #
    # A property, not a code change, so switching it on — and rolling it back
    # — is a restart. Flip with REQUIRE_AUTH=true.
    require-auth: ${REQUIRE_AUTH:false}
  activity:
    # The activity trail records EVERY request, reads included, so three knobs
    # matter operationally:
    #   enabled        — the whole feature, off in one restart if it ever hurts
    #   retention-days — a POLICY default, not a decision. 0 or less = keep
    #                    everything (and own the growth yourself)
    #   queue-capacity — rows buffered before the writer starts dropping. It
    #                    drops rather than blocks: an unbounded buffer turns a
    #                    slow database into an out-of-memory kill
    enabled: ${ACTIVITY_LOG_ENABLED:true}
    retention-days: ${ACTIVITY_RETENTION_DAYS:365}
    queue-capacity: 10000
  # Every entry is created at startup by SuperAdminSeeder unless a User
  # already holds that email, so all of these credentials open the dashboard.
  # dob IS the password (see User.dob) — the login form wants 2001-01-01
  # typed as 01/01/2001, four-digit year.
  #
  # Seeding only ever adds. Editing a dob here does NOT change an account that
