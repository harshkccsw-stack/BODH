spring:
  application:
    name: bodhpsychometric
  profiles:
    # Pick the active profile with SPRING_PROFILES_ACTIVE (defaults to development).
    active: ${SPRING_PROFILES_ACTIVE:development}

---
# ============================================================================
# development
# ============================================================================
spring:
  config:
    activate:
      on-profile: development

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:bodhpsychometric}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:bodh}
    password: ${DB_PASSWORD:bodh}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Quote identifiers that collide with the dialect's reserved words
        # (e.g. the User table on H2), so entity names stay portable.
        auto_quote_keyword: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3002}
  superadmin:
    email: superadmin@bodh.biz
    dob: 1990-01-01
  jwt:
    # HS256 needs >= 32 bytes; override in every real environment.
    secret: ${JWT_SECRET:eb36fabf9a4245f0e94e981537361065878f2b21d557f75b0137343b7de06f80}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}

---
# ============================================================================
# production
# ============================================================================
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:mysql://bodhpsychometric-mysql:3306/bodhpsychometric?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:bodh}
    password: ${DB_PASSWORD:bodh}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Quote identifiers that collide with the dialect's reserved words
        # (e.g. the User table on H2), so entity names stay portable.
        auto_quote_keyword: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://admin.bodh.biz,https://*.bodh.biz,https://portal.bodh.biz}
  superadmin:
    email: superadmin@bodh.biz
    dob: 1990-01-01
  jwt:
    # HS256 needs >= 32 bytes; override in every real environment.
    secret: ${JWT_SECRET:eb36fabf9a4245f0e94e981537361065878f2b21d557f75b0137343b7de06f80}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
