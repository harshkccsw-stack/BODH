spring:
  datasource:
    url: jdbc:h2:mem:bodhpsychometric;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Flyway is OFF for tests: the migrations are MySQL-flavoured (enum columns,
  # PREPARE/EXECUTE guards) and would not run on H2. Tests keep building the
  # schema from the entities, which is also what makes them catch mapping
  # mistakes before a migration is ever written.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # "User" is a reserved word in H2 (not MySQL); quote keywords per dialect.
        auto_quote_keyword: true

app:
  # Redis is OFF for tests: PortalRedisStore then no-ops on every call and the
  # whole take flow runs its MySQL-degraded path — which is also the pre-Redis
  # behaviour the existing tests were written against. No Redis server is
  # needed to run the suite.
  redis:
    enabled: false
  # Two entries on purpose: seeding more than one superadmin is a supported
  # configuration, so the tests cover it rather than only the first element.
  superadmins:
    - email: superadmin@test.local
      dob: 1990-01-01
    - email: second.admin@test.local
      dob: 1985-05-05
  jwt:
    secret: ${JWT_SECRET:eb36fabf9a4245f0e94e981537361065878f2b21d557f75b0137343b7de06f80}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
